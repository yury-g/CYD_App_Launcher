<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="CYD Pulse Dashboard lab banner">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="0.55" stop-color="#e9fff9"/>
      <stop offset="1" stop-color="#e7f0ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9d8d2" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#153b42" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#paper)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <path d="M0 260 C150 210 260 260 390 230 C560 188 680 270 840 220 C980 176 1070 210 1200 170 L1200 320 L0 320 Z" fill="#00c9b7" opacity="0.15"/>
  <path d="M40 210 C110 190 140 140 190 145 C230 149 245 225 300 216 C348 208 360 132 415 128 C472 124 496 220 555 216 C607 212 625 150 670 150 C728 150 748 228 805 224 C862 220 875 130 935 125 C995 120 1020 205 1088 194 C1128 188 1155 164 1180 150" fill="none" stroke="#00c9d9" stroke-width="9" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <rect x="62" y="54" width="660" height="156" rx="18" fill="#101616"/>
    <text x="92" y="94" fill="#ffcf54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">LAB HANDOUT</text>
    <text x="92" y="145" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="800">CYD Pulse Dashboard</text>
    <text x="92" y="182" fill="#b8fff8" font-family="Arial, sans-serif" font-size="21">Flash it. Wire it. Watch your pulse become data.</text>
  </g>

  <g transform="translate(862 62)">
    <rect x="0" y="0" width="210" height="156" rx="18" fill="#141414" stroke="#263a36" stroke-width="4"/>
    <rect x="16" y="18" width="178" height="78" rx="10" fill="#000000" stroke="#19322f" stroke-width="3"/>
    <path d="M26 58 L44 54 L63 62 L82 44 L103 72 L124 32 L146 63 L168 48 L184 58" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="120" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800">72</text>
    <text x="24" y="142" fill="#9aa4a0" font-family="Arial, sans-serif" font-size="14">BPM</text>
    <circle cx="154" cy="122" r="12" fill="#ff1f1f"/>
    <circle cx="170" cy="122" r="12" fill="#ff1f1f"/>
    <path d="M139 128 L185 128 L162 154 Z" fill="#ff1f1f"/>
  </g>

  <g transform="translate(742 78)">
    <rect x="0" y="0" width="104" height="32" rx="16" fill="#ffcf54"/>
    <text x="17" y="22" fill="#10211f" font-family="Arial, sans-serif" font-size="15" font-weight="800">GPIO 35</text>
    <rect x="0" y="46" width="126" height="32" rx="16" fill="#ff6b6b"/>
    <text x="17" y="68" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="800">3.3V ONLY</text>
    <rect x="0" y="92" width="110" height="32" rx="16" fill="#00c9b7"/>
    <text x="17" y="114" fill="#06211f" font-family="Arial, sans-serif" font-size="15" font-weight="800">SOUND</text>
  </g>
</svg>
